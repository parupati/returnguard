[project]
name = "returnguard"
version = "0.1.0"
description = "Autonomous return-risk intervention agent (Composable AI Hackathon 2026, Track 5)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "google-genai>=1.30",
    "databricks-sdk>=0.143.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
returnguard = "returnguard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returnguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=returnguard --cov-report=term-missing"
